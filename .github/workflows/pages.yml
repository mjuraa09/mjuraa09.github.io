# Publishes the static site to GitHub Pages on every push to main.
# Only the site itself is uploaded: tests/, tools/, screenshots and config stay out.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect site files
        run: |
          mkdir _site
          cp *.html _site/
          cp -R css js images fonts documents projects data _site/
          # CNAME (custom domain) is added later; copy it if present.
          [ -f CNAME ] && cp CNAME _site/ || true

      # GitHub Pages serves every file with `cache-control: max-age=600`, so a browser keeps
      # the old css/js for up to 10 minutes after a deploy (and far longer once it has been
      # revisited). Stamping the commit into the URLs makes every change a new file, so a
      # visitor never runs new HTML against an old stylesheet or script.
      - name: Stamp css/js URLs with the commit
        run: |
          v="${GITHUB_SHA::8}"
          find _site -name '*.html' -print0 |
            xargs -0 sed -i -E "s@(src|href)=\"((\.\./)?(css|js)/[^\"?]+\.(css|js))\"@\1=\"\2?v=$v\"@g"
          echo "stamped $(grep -o '?v=' _site/index.html | wc -l) references on index.html"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
